name: ai-employee

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-employee-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_employee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_employee_dev}
      POSTGRES_DB: ${POSTGRES_DB:-ai_employee}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_employee}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ai-employee-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:latest
    container_name: ai-employee-n8n
    restart: unless-stopped
    environment:
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-change-me-n8n-password}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change-me-n8n-encryption-key}
      DB_TYPE: sqlite
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Colombo}
      # n8n 2.x blocks `$env.*` in expressions / Code nodes by default, which
      # makes the example workflows (they read CRM_BASE_URL / SLACK_WEBHOOK_URL
      # this way) fail with "access to env vars denied". Allow it, and pass the
      # vars the example workflows expect through to the container.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_RUNNERS_TASK_ENV_ALLOW_LIST: "*"
      # Your real CRM's REST endpoint; leave empty to keep CRM nodes disabled.
      CRM_BASE_URL: ${CRM_BASE_URL:-}
      # Lets workflows call back into the AI Employee API (/channels/send, /notifications/*).
      AI_EMPLOYEE_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-http://host.docker.internal:3001/api/v1/notifications/slack}
      GLOWDESK_API_URL: ${GLOWDESK_API_URL:-http://host.docker.internal:3141}
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-http://host.docker.internal:3001/api/v1/channels/send}
      EMAIL_API_URL: ${EMAIL_API_URL:-http://host.docker.internal:3001/api/v1/notifications/email}
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/home/node/workflows
    # So `CRM_BASE_URL=http://host.docker.internal:...` in a workflow can reach a
    # service running on the host (auto on Docker Desktop; this line is what makes
    # it resolve on Linux too).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres

  # Intent classifier (Rasa Open Source, NLU only). Internal service: the port is
  # published on 127.0.0.1 only so the API can reach it when it runs on the host
  # (start.sh); inside Compose the API uses http://rasa:5005. The trained model is
  # baked into the image, so it starts with no external LLM or API key.
  rasa:
    build:
      context: ./rasa
    image: ai-employee-rasa:${RASA_MODEL_VERSION:-latest}
    container_name: ai-employee-rasa
    restart: unless-stopped
    environment:
      RASA_AUTH_TOKEN: ${RASA_AUTH_TOKEN:-change-me-rasa-token}
    ports:
      - "127.0.0.1:${RASA_PORT:-5005}:5005"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5005/version', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1536M

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ai-employee-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ai_employee}:${POSTGRES_PASSWORD:-ai_employee_dev}@postgres:5432/${POSTGRES_DB:-ai_employee}?schema=public
      REDIS_HOST: redis
      REDIS_URL: redis://redis:6379
      N8N_API_URL: http://n8n:5678/api/v1
      # Rasa is optional at runtime: if it is down the API answers through the LLM.
      RASA_BASE_URL: http://rasa:5005
    ports:
      - "${API_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ai-employee-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:3001}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  n8n_data:
